[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperion-flaresolverr"
version = "0.1.0"
description = "A requests transport adapter that falls back to FlareSolverr on a Cloudflare challenge."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hyperion AI Agency" }]
dependencies = ["requests>=2.28,<3"]

[project.urls]
Repository = "https://github.com/hyperion-ai-agency/hyperion-flaresolverr"

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hyperion_flaresolverr"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
